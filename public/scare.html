<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scare Night">
<title>Scare Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,700&display=swap">
<style>
/* Layout: phone-app shell. Sticky top bar + preset strip, poster grid, bottom tab bar; filters and details open as bottom sheets. Same midnight + gold world as Movie Night. */
:root{
  color-scheme:dark;
  --night:#0a1530; --deep:#050a1d; --card:#13214a; --card2:#1a2b5c; --line:rgba(245,197,24,.16);
  --gold:#f5c518; --gold-soft:rgba(245,197,24,.6); --ink:#e8e3d5; --muted:rgba(232,227,213,.6);
  --s-low:#4cc38a; --s-mid:#f0a830; --s-high:#ef5a3c;
  --display:'Didot','Bodoni 72','Playfair Display',Georgia,serif;
  --body:'Inter','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--deep)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background:radial-gradient(ellipse 90% 50% at 50% 0%,#1a2b5c 0%,var(--night) 45%,var(--deep) 100%) fixed;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:linear-gradient(var(--night) 70%,rgba(10,21,48,.0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.back{display:flex;align-items:center;gap:4px;color:var(--gold-soft);font-size:13px;text-decoration:none;white-space:nowrap}
.back svg{width:18px;height:18px}
h1{flex:1;margin:0;text-align:center;font-family:var(--display);font-style:italic;font-weight:500;font-size:24px;color:var(--gold);letter-spacing:.01em}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px}
.search{max-width:1100px;margin:10px auto 0;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.6}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:10px auto 0;padding-bottom:2px}
.presets::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.pill small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.pill[aria-pressed="true"] small{color:#3a2e00}

main{max-width:1100px;margin:0 auto;padding:4px 16px calc(var(--safe-b) + 96px)}
.summary{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:8px 2px 12px}
.summary b{color:var(--ink);font-weight:600}
.summary button{color:var(--gold);font-weight:600;font-size:12px;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card2);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;min-width:34px;height:34px;padding:0 6px;border-radius:10px;display:grid;place-items:center;
  font-weight:700;font-size:16px;color:#08101f;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lv-low{background:var(--s-low)} .lv-mid{background:var(--s-mid)} .lv-high{background:var(--s-high);color:#fff}
.ct{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cm{font-size:12px;color:var(--muted);margin-top:-3px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:8px 8px calc(var(--safe-b) + 8px);background:rgba(5,10,29,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 14px;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--gold)}
.dot{position:absolute;top:0;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#1a1300;font-size:10px;display:grid;place-items:center;padding:0 4px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  background:#0d1a3d;border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:8px 18px calc(var(--safe-b) + 22px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(232,227,213,.25);margin:4px auto 12px}
.sheet h2{font-family:var(--display);font-style:italic;font-weight:500;color:var(--gold);font-size:22px;margin:0 0 4px}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.sec-h span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.sec-h b{color:var(--gold);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.dual{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chip[aria-pressed="true"]{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:600}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--card2);border-radius:14px;position:relative;border:1px solid var(--line);transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked{background:var(--gold)} .switch input:checked::after{transform:translateX(18px);background:#1a1300}
select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sheet-actions{display:flex;gap:10px;position:sticky;bottom:calc(-1 * (var(--safe-b) + 22px));background:#0d1a3d;padding:12px 0 calc(var(--safe-b) + 4px);margin-top:4px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;text-align:center;text-decoration:none;font-size:15px}
.btn.primary{background:var(--gold);color:#1a1300;flex:2;white-space:nowrap}
.btn.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink)}

.d-top{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.d-top img{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.d-title{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.1;color:var(--gold);margin:2px 0 6px;text-wrap:balance}
.d-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.d-meta .r{border:1px solid var(--muted);border-radius:4px;padding:0 5px;color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--ink)}
.tag.warn{background:transparent;border:1px solid var(--s-mid);color:var(--s-mid)}
.meters{display:grid;gap:12px;margin-top:16px}
.meter-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.meter-row .lbl{color:var(--muted)}
.meter-row .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.track{display:flex;gap:3px}
.track i{flex:1;height:8px;border-radius:2px;background:var(--card2)}
.track i.on{background:var(--c)}
.meter-note{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-6px}
.d-why{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:rgba(239,90,60,.1);border:1px solid rgba(239,90,60,.3);font-size:14px}
.d-why b{color:var(--s-high)}
.d-syn{margin:14px 0 0;font-size:15px;line-height:1.55}
.guess{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
@media (min-width:700px){.tabs{max-width:520px;margin:0 auto 14px;border-radius:18px;border:1px solid var(--line);left:16px;right:16px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="back" href="/movies.html" aria-label="Back to Movie Night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Movie Night</a>
    <h1>Scare Night</h1>
    <button class="iconbtn" id="openFilters2" aria-label="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search titles, plots, monsters…" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="presets" id="presets" role="group" aria-label="Who's watching"></div>
</header>

<main>
  <div class="summary"><span id="summary"></span><button id="reset" type="button">Reset</button></div>
  <div class="grid" id="grid"></div>
</main>

<nav class="tabs" aria-label="App">
  <button class="tab on" id="tabBrowse" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>Browse</button>
  <button class="tab" id="openFilters" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<span class="dot" id="fcount" hidden></span></button>
  <button class="tab" id="surprise" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>Surprise me</button>
</nav>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="filters" role="dialog" aria-modal="true" aria-labelledby="fh" hidden>
  <div class="grab"></div>
  <h2 id="fh">Filters</h2>
  <div class="sec">
    <div class="sec-h"><span>Scare level</span><b id="scV"></b></div>
    <div class="dual"><label for="scMin">From</label><input id="scMin" type="range" min="1" max="10" value="1">
      <label for="scMax">To</label><input id="scMax" type="range" min="1" max="10" value="10"></div>
    <p class="hint">1–3 spooky fun · 4–6 real jumps · 7–10 true horror</p>
  </div>
  <div class="sec">
    <div class="sec-h"><span>Supernatural, up to</span><b id="ocV"></b></div>
    <input id="oc" type="range" min="0" max="5" value="5">
    <p class="hint" id="ocH"></p>
  </div>
  <div class="sec">
    <div class="sec-h"><span>Sex &amp; nudity, up to</span><b id="sxV"></b></div>
    <input id="sx" type="range" min="0" max="5" value="5">
    <p class="hint" id="sxH"></p>
  </div>
  <div class="sec">
    <label class="switch"><span><b>Hide cults</b><br><span class="hint">Cult groups or brainwashing in the story</span></span><input id="cult" type="checkbox"></label>
  </div>
  <div class="sec">
    <div class="sec-h"><span>Kind of movie</span></div>
    <div class="chips" id="cats"></div>
  </div>
  <div class="sec">
    <div class="sec-h"><span>Sort</span></div>
    <select id="sort" aria-label="Sort">
      <option value="scare">Least scary first</option>
      <option value="scare-desc">Scariest first</option>
      <option value="title">Title A–Z</option>
      <option value="year">Newest first</option>
      <option value="old">Oldest first</option>
    </select>
  </div>
  <div class="sheet-actions">
    <button class="btn ghost" id="fReset" type="button">Reset</button>
    <button class="btn primary" id="fDone" type="button">Show movies</button>
  </div>
</section>

<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="grab"></div>
  <div id="dBody"></div>
</section>

<script>
const MOVIES = [{"t":"Casper","y":1995,"cat":"Family spooky","rated":"PG","sc":1,"syn":"Casper is a kind young ghost who peacefully haunts a mansion in Maine. When specialist James Harvey arrives to communicate with Casper and his fellow spirits, he brings along his teenage daughter, Kat. Casper quickly falls in love with Kat, but their budding relationship is complicated not only by his transparent state, but also by his troublemaking apparition uncles and their mischievous antics.","why":"Silly ghost uncles; one sad theme about death.","genres":["Fantasy","Comedy","Family"],"id":8839,"f":"","o":1,"x":0,"p":"/2ah8fNJFZVU3vcXhU5xfAYi2eym.jpg","rt":100},{"t":"Abbott and Costello Meet Frankenstein","y":1948,"cat":"Classic monster","rated":"NR","sc":2,"syn":"The Wolf Man tries to warn a dimwitted porter that Dracula wants his brain for Frankenstein monster's body.","why":"Played for laughs; monsters look dated.","genres":["Horror","Comedy"],"id":3073,"f":"","o":1,"x":0,"p":"/tCMtyjL7aFRalXBDkHKz1bMVRHm.jpg","rt":83},{"t":"Abbott and Costello Meet the Invisible Man","y":1951,"cat":"Classic monster","rated":"NR","sc":1,"syn":"As novice detectives, Bud and Lou come face to face with the Invisible Man.","why":"Barely scary; a comedy.","genres":["Horror","Comedy","Science Fiction"],"id":33475,"f":"","o":0,"x":0,"p":"/qNsAGXUy2j3pyCc72YntENPUdef.jpg","rt":83},{"t":"Abbott and Costello Meet the Mummy","y":1955,"cat":"Classic monster","rated":"NR","sc":1,"syn":"Bud and Lou, two stranded American archaeologists, run afoul of an Egyptian cult with big plans to resurrect the mummified corpse of Klaris, guardian of his Princess Ara's treasure-filled tomb. When Lou accidentally eats the cursed medallion needed to find the ancient treasure, the two become targets of the cult's leader, his goons, a mysterious femme fatale, and the mummy of Klaris himself!","why":"Slapstick, not scary.","genres":["Adventure","Horror","Comedy","Fantasy"],"id":26661,"f":"c","o":1,"x":0,"p":"/sMW2cKK4RBMgN9xDHY4utzOYWxn.jpg","rt":79},{"t":"The Ghost and Mr. Chicken","y":1966,"cat":"Family spooky","rated":"G","sc":1,"syn":"Luther Heggs, a typesetter for the town newspaper, pitches an idea for a story about a local haunted house where a famous murder/suicide occurred 20 years earlier. After the editor assigns Luther to spend one night alone in the mansion, Heggs has a number of supernatural encounters and writes a front page story that makes him a hometown hero...until the nephew of the deceased sues him for libel.","why":"Creaky-house gags; a Don Knotts comedy.","genres":["Comedy","Family","Mystery","Romance"],"id":13343,"f":"","o":1,"x":0,"p":"/AomOgoN5kmVtMWWMKVeTPT8nVOE.jpg","rt":90},{"t":"Matinee","y":1993,"cat":"Family spooky","rated":"PG","sc":1,"syn":"A showman introduces a small coastal town to a unique movie experience and capitalizes on the Cuban Missile crisis hysteria with a kitschy horror extravaganza combining film effects, stage props and actors in rubber suits in this salute to the B-movie.","why":"A love letter to scary movies, not one itself.","genres":["Comedy"],"id":25389,"f":"","o":0,"x":0,"p":"/2S6FEhl4dpr5E0mj3sth0XxJQAu.jpg","rt":99},{"t":"Phantom of the Opera","y":1943,"cat":"Classic monster","rated":"NR","sc":1,"syn":"Following a tragic accident that leaves him disfigured, crazed composer Erique Claudin transformed into a masked phantom who schemes to make beautiful young soprano Christine Dubois the star of the opera and wreak revenge on those who stole his music.","why":"More musical than horror.","genres":["Horror","Romance"],"id":15855,"f":"","o":0,"x":0,"p":"/2C8aHB3xnN8LvlsNLHKumBXzgVu.jpg","rt":89},{"t":"She-Wolf of London","y":1946,"cat":"Classic monster","rated":"NR","sc":1,"syn":"A young heiress finds evidence suggesting that at night she acts under the influence of a family curse and has begun committing ghastly murders in a nearby park.","why":"A mystery with no real monster.","genres":["Mystery","Horror","Thriller"],"id":45322, ycEsvl51BdV.jpg","rt":108},{"t":"Ghostbusters (2016)","y":2016,"cat":"Family spooky","rated":"PG-13","sc":2,"syn":"Following a ghost invasion of Manhattan, paranormal enthusiasts Erin Gilbert and Abby Yates, nuclear engineer Jillian Holtzmann, and subway worker Patty Tolan band together to stop the otherworldly threat.","why":"Cartoonish ghosts, a few jumps.","genres":["Action","Fantasy","Comedy"],"id":43074,"f":"","o":2,"x":0,"p":"/wJmWliwXIgZOCCVOcGRBhce7xPS.jpg","rt":117},{"t":"Gremlins 2: The New Batch","y":1990,"cat":"Family spooky","rated":"PG-13","sc":2,"syn":"Young sweethearts Billy and Kate move to the Big Apple, land jobs in a high-tech office park and soon reunite with the friendly and lovable Gizmo. But a series of accidents creates a whole new generation of Gremlins. The situation worsens when the devilish green creatures invade a top-secret laboratory and develop genetically altered powers, making them even harder to destroy!","why":"Zany satire; less scary than the first.","genres":["Comedy","Horror","Fantasy"],"id":928,"f":"","o":0,"x":0,"p":"/35F5yD7MljvBE2AC0NHAVCoPGEi.jpg","rt":106},{"t":"Little Shop of Horrors","y":1986,"cat":"Horror comedy","rated":"PG-13","sc":2,"syn":"Seymour Krelborn is a nerdy orphan working at Mushnik's, a flower shop in urban Skid Row. He harbors a crush on fellow co-worker, Audrey Fulquard, and is berated by Mr. Mushnik daily. One day, Seymour finds a very mysterious unidentified plant which he calls Audrey II. The plant seems to have a craving for blood and soon begins to sing for its supper.","why":"A musical; the plant eats people offscreen.","genres":["Horror","Comedy"],"id":10776,"f":"","o":0,"x":0,"p":"/iKkbN17OmFosaW6asCNZTTsyvpu.jpg","rt":94},{"t":"Ernest Scared Stupid","y":1991,"cat":"Family spooky","rated":"PG","sc":2,"syn":"Well-intentioned, eternally bumbling Ernest P. Worrell accidentally releases an evil demon from its sacred tomb. As the demon flexes its power and goes on a ruinous rampage, good-guy Ernest  within him — as well as everyone around him — as the walls between his compartments shatter apart.","why":"Kidnapping, menace, abuse themes.","genres":["Horror","Thriller"],"id":381288,"f":"","o":0,"x":0,"p":"/ow2BSQGKJtZpH2zZY1rmX8eXKAi.jpg","rt":117},{"t":"Breakdown","y":1997,"cat":"Thriller","rated":"R","sc":5,"syn":"On their cross-country drive, a married couple, Jeff and Amy Taylor, experience car trouble after their SUV breaks down. Stranded in the New Mexico desert, the two catch a break when a passing truck driver offers Amy a ride to a nearby café to call for help. Meanwhile, Jeff is able to fix the car and make his way to the café, but Amy isn't there. He tracks down the trucker ― who tells the police he's never seen Jeff or his wife before. Jeff then begins a desperate, frenzied search for Amy.","why":"Intense, violent.","genres":["Crime","Mystery","Thriller","Action"],"id":2163,"f":"","o":0,"x":0,"p":"/m3VB59ppr1RlpxNUYRUfZTgjgU.jpg","rt":93},{"t":"Collateral","y":2004,"cat":"Thriller","rated":"R","sc":5,"syn":"Cab driver Max picks up a man who offers him $600 to drive him around. But the promise of easy money sours when Max realizes his fare is an assassin.","why":"Gun violence.","genres":["Drama","Crime","Thriller"],"id":1538,"f":"","o":0,"x":0,"p":"/nV5316WUsVij8sVXLCF1g7TFitg.jpg","rt":120},{"t":"Panic Room","y":2002,"cat":"Thriller","rated":"R","sc":5,"syn":"Trapped in their New York brownstone's panic room, a hidden chamber built as a sanctuary in the event of break-ins, newly divorced Meg Altman and her young daughter Sarah play a deadly game of cat-and-mouse with three intruders - Burnham, Raoul and Junior - during a brutal home invasion. But the room itself is the focal point because what the intruders really want is inside it.","why":"Home-invasion tension.","genres":["Crime","Drama","Thriller"],"id":4547,"f":"","o":0,"x":0,"p":"/hANYbvfwxmkC9E4yY6YyJxYxlSJ.jpg","rt":111},{"t":"Nightcrawler","y":2014,"cat":"Thriller","rated":"R","sc":5,"syn":" e infected. Carried by animals and humans, the virus turns those it infects into homicidal maniacs -- and it's absolutely impossible to contain.","why":"Fast, vicious infected.","genres":["Horror","Thriller","Science Fiction"],"id":170,"f":"","o":0,"x":3,"p":"/sQckQRt17VaWbo39GIu0TMOiszq.jpg","rt":113},{"t":"28 Weeks Later","y":2007,"cat":"Horror","rated":"R","sc":8,"syn":"Twenty-eight weeks after the spread of a deadly rage virus, the inhabitants of the British Isles have lost their battle against the onslaught, as the virus has killed everyone there. Six months later, a group of Americans dare to set foot on the Isles, convinced the danger has passed. But it soon becomes all too clear that the scourge continues to live, waiting to pounce on its next victims.","why":"Brutal opening.","genres":["Horror","Thriller","Science Fiction"],"id":1562,"f":"","o":0,"x":0,"p":"/oix0aNv1lvW3nUGspUyvSIBlpbs.jpg","rt":99},{"t":"The Shining","y":1980,"cat":"Horror","rated":"R","sc":8,"syn":"Jack Torrance accepts a caretaker job at the Overlook Hotel, where he, along with his wife Wendy and their son Danny, must live isolated from the rest of the world for the winter. But they aren't prepared for the madness that lurks within.","why":"The twins, Room 237.","genres":["Horror","Thriller"],"id":694,"f":"","o":3,"x":3,"p":"/uAR0AWqhQL1hQa69UDEbb2rE5Wx.jpg","rt":144},{"t":"The Ring","y":2002,"cat":"Horror","rated":"PG-13","sc":8,"syn":"Journalist Rachel Keller investigates a strange videotape that may be behind the untimely deaths of four teenagers. There is an urban legend about this tape: the viewer will die seven days after watching it. Rachel tracks down the video... and watches it. Now she has just seven days to unravel the mystery of the Ring in order to save herself and her son.","why":"Samara crawling out of the TV. PG-13 but very scary.","genres":["Horror","Mystery"],"id":565,"f":"","o":3,"x":0,"p":"/AeRpUynJKDpJveklBJipOYrVxCS.jpg","rt":115},{"t":"The Silence of the Lambs","y":1991,"cat":"Thriller","rated":"R","sc":8,"syn":"Clarice Starling is a top student at the FBI's training academy.  Jack Crawford wants Clarice to interview Dr. Hannibal Lecter, a brilliant psychiatrist who is also a violent psychopath, serving life behind bars for various acts of murder and cannibalism.  Crawford believes that Lecter may have insight into a case and that Starling, as an attractive young woman, may be just the bait to draw him out.","why":"Disturbing, violent.","genres":["Crime","Thriller","Drama"],"id":274,"f":"","o":0,"x":3,"p":"/uS9m8OBk1A8eM9I042bx8XXpqAq.jpg","rt":119},{"t":"Seven","y":1995,"cat":"Thriller","rated":"R","sc":8,"syn":"Two homicide detectives are on a desperate hunt for a serial killer whose crimes are based on the \"seven deadly sins\" in this dark and haunting film that takes viewers from the tortured remains of one victim to the next. The seasoned Det. Somerset researches each sin in an effort to get inside the killer's mind, while his novice partner, Mills, scoffs at his efforts to unravel the case.","why":"Grisly crime scenes, devastating ending.","genres":["Crime","Mystery","Thriller"],"id":807,"f":"","o":0,"x":3,"p":"/191nKfP0ehp3uIvWqgPbFmI4lv9.jpg","rt":127},{"t":"The Evil Dead","y":1983,"cat":"Horror","rated":"NC-17","sc":8,"syn":"In 1979, a group of college students find a Sumerian Book of the Dead in an old wilderness cabin they've rented for a weekend getaway.","why":"Gory and raw.","genres":["Horror"],"id":764,"f":"","o":4,"x":5,"p":"/54C1qdaiSijIU5NeNb4WsPJdNkG.jpg","rt":85},{"t":"Evil Dead 2","y":1987,"cat":"Horror comedy","rated":"R","sc":6,"syn":"Ash Williams and his girlfriend Linda find a log cabin in the woods with a voice recording from an archeologist who had recorded himself reciting ancient chants from \"The Book of the Dead.\" As they play the recording an evil power is unleashed taking over Linda's body.","why":"Slapstick gore.","genres":["Horror","Comedy","Fantasy"],"id":765,"f":"","o":3,"x":0,"p":"/xfPOxLpHexVguBauZRPpYs8hueo.jpg","rt":84},{"t":"Alien","y":1979,"cat":"Scary sci-fi","rated":"R","sc":9,"syn":"During its return to the earth, commercial spaceship Nostromo intercepts a distress signal from a distant planet. When a three-member team of the crew discovers a chamber containing thousands of eggs on the planet, a creature inside one of the eggs attacks an explorer. The entire crew is unaware of the impending nightmare set to descend upon them when the alien parasite planted inside its unfortunate host is birthed.","why":"The chestburster. A masterpiece of tension.","genres":["Horror","Science Fiction"],"id":348,"f":"","o":0,"x":0,"p":"/vfrQk5IPloGg1v9Rzbh2Eg3VGyM.jpg","rt":117},{"t":"Alien: Romulus","y":2024,"cat":"Scary sci-fi","rated":"R","sc":9,"syn":"While scavenging the deep ends of a derelict space station, a group of young space colonizers come face to face with the most terrifying life form in the universe.","why":"Relentless, gory.","genres":["Horror","Science Fiction"],"id":945961,"f":"","o":0,"x":0,"p":"/2uSWRTtCG336nuBiG8jOTEUKSy8.jpg","rt":119},{"t":"The Thing","y":1982,"cat":"Scary sci-fi","rated":"R","sc":9,"syn":"A research team in Antarctica is hunted by a shape-shifting alien that assumes the appearance of its victims.","why":"Grotesque transformations.","genres":["Horror","Mystery","Science Fiction"],"id":1091,"f":"","o":0,"x":0,"p":"/tzGY49kseSE9QAKk47uuDGwnSCu.jpg","rt":109},{"t":"The Conjuring","y":2013,"cat":"Horror","rated":"R","sc":10,"syn":"Paranormal investigators Ed and Lorraine Warren work to help a family terrorized by a dark presence in their farmhouse. Forced to confront a powerful entity, the Warrens find themselves caught in the most terrifying case of their lives.","why":"The hide-and-clap scene. No gore, all fear.","genres":["Horror","Thriller"],"id":138843,"f":"","o":5,"x":0,"p":"/wVYREutTvI2tmxr6ujrHT704wGF.jpg","rt":112},{"t":"The Conjuring 2","y":2016,"cat":"Horror","rated":"R","sc":9,"syn":"Lorraine and Ed Warren travel to north London to help a single mother raising four children alone in a house plagued by malicious spirits.","why":"The nun painting, the Crooked Man.","genres":["Horror"],"id":259693,"f":"","o":5,"x":0,"p":"/zEqyD0SBt6HL7W9JQoWwtd5Do1T.jpg","rt":134},{"t":"The Conjuring: The Devil Made Me Do It","y":2021,"cat":"Horror","rated":"R","sc":7,"syn":"Paranormal investigators Ed and Lorraine Warren encounter what would become one of the most sensational cases from their files. The fight for the soul of a young boy takes them beyond anything they'd ever seen before, to mark the first time in U.S. history that a murder suspect would claim demonic possession as a defense.","why":"Less scary than the first two.","genres":["Horror","Mystery","Thriller"],"id":423108,"f":"c","o":5,"x":0,"p":"/xbSuFiJbbBWCkyCCKIMfuDCA4yV.jpg","rt":111},{"t":"Barbarian","y":2022,"cat":"Horror","rated":"R","sc":10,"syn":"In town for a job interview, a young woman arrives at her Airbnb late at night only to find that it has been mistakenly double-booked and a strange man is already staying there. Against her better judgement, she decides to stay the night anyway.","why":"Shocking twists and violence.","genres":["Horror","Mystery","Thriller"],"id":913290,"f":"","o":0,"x":4,"p":"/idT5mnqPcJgSkvpDX7pJffBzdVH.jpg","rt":103},{"t":"Evil Dead","y":2013,"cat":"Horror","rated":"R","sc":10,"syn":"Mia, a drug addict, is determined to kick the habit. To that end, she asks her brother, David, his girlfriend, Natalie and their friends Olivia and Eric to accompany her to their family's remote forest cabin to help her through withdrawal. Eric finds a mysterious Book of the Dead at the cabin and reads aloud from it, awakening an ancient demon. All hell breaks loose when the malevolent entity possesses Mia.","why":"Extremely gory.","genres":["Horror"],"id":109428,"f":"","o":5,"x":4,"p":"/1gDV0Lm9y8ufIKzyf0h0GBgb9Zj.jpg","rt":91},{"t":"Evil Dead Rise","y":2023,"cat":"Horror","rated":"R","sc":10,"syn":"A reunion between two estranged sisters gets cut short by the rise of flesh-possessing demons, thrusting them into a primal battle for survival as they face the most nightmarish version of family imaginable.","why":"Extremely gory, kids in danger.","genres":["Horror","Thriller"],"id":713704,"f":"","o":5,"x":0,"p":"/5ik4ATKmNtmJU6AYD0bLm56BCVM.jpg","rt":96},{"t":"Evil Dead Burn","y":2026,"cat":"Horror","rated":"R","sc":9,"syn":"After her husband's abrupt death, Alice seeks solace with his remaining family — descendants of a leading researcher on demonic possession. As her in-laws transform one by one into creatures that feed on fear, she comes to discover that the vows she took in life survive even in death.","why":"Expect extreme gore like Rise.","uns":true,"genres":["Horror"],"id":1212763,"f":"","o":5,"x":0,"p":"/uRxrNXQWkHoENm3nwVOZDYSCx2F.jpg","rt":110},{"t":"Anaconda","y":2025,"cat":"Horror comedy","rated":"PG-13","sc":4,"syn":"A group of friends facing mid-life crises head to the rainforest with the intention of remaking their favorite movie from their youth, only to find themselves in a fight for their lives against natural disasters, giant snakes and violent criminals.","why":"Played for comedy.","uns":true,"genres":["Adventure","Comedy","Horror"],"id":1234731,"f":"","o":0,"x":0,"p":"/hBxN6dwrANN1ic3a4G9x6JZcR3C.jpg","rt":100},{"t":"Hellboy II: The Golden Army","y":2008,"cat":"Horror adventure","rated":"PG-13","sc":3,"syn":"Hellboy, his pyrokinetic girlfriend, Liz, and aquatic empath, Abe Sapien, face their biggest battle when an underworld elven prince plans to reclaim Earth for his magical kindred. Tired of living in the shadow of humans, Prince Nuada tries to awaken an ancient force of killing machines, the all-powerful Golden Army, to clear the way for fantasy creatures to roam free. Only Hellboy can stop the dark prince and prevent humanity's annihilation.","why":"Creatures, fantasy violence.","genres":["Fantasy","Action"],"id":11253,"f":"","o":2,"x":0,"p":"/zO0Wdrxnhx3KoJEvychSmnY3urC.jpg","rt":120},{"t":"Small Soldiers","y":1998,"cat":"Family spooky","rated":"PG-13","sc":3,"syn":"When missile technology is used to enhance toy action figures, the toys soon begin to take their battle programming too seriously.","why":"Creepy dolls attack.","genres":["Comedy","Adventure","Fantasy","Science Fiction","Action"],"id":11551,"f":"","o":0,"x":0,"p":"/2nuUjSzHsoYlRvTPmLo7m7gCQry.jpg","rt":110},{"t":"Harry and the Hendersons","y":1987,"cat":"Family spooky","rated":"PG","sc":1,"syn":"Returning from a hunting trip in the forest, the Henderson family's car hits an animal in the road. At first they fear it was a man, but when they examine the \"body\" they find it's a \"bigfoot\". They think it's dead so they decide to take it home (there could be some money in this). As you guessed, it isn't dead. Far from being the ferocious monster they fear \"Harry\" to be, he's a friendly giant.","why":"Bigfoot looks scary at first.","genres":["Comedy","Family","Fantasy"],"id":8989,"f":"","o":0,"x":0,"p":"/5ZNWhOEsuNHIQ1gbtwdTGK7srCr.jpg","rt":110},{"t":"Edward Scissorhands","y":1990,"cat":"Family spooky","rated":"PG-13","sc":2,"syn":"A small suburban town receives a visit from a castaway unfinished science experiment named Edward.","why":"Gothic look, little scariness.","genres":["Fantasy","Drama","Romance"],"id":162,"f":"","o":0,"x":0,"p":"/e0FqKFvGPdQNWG8tF9cZBtev9Em.jpg","rt":105},{"t":"Teen Wolf","y":1985,"cat":"Family spooky","rated":"PG","sc":1,"syn":"When a shy teenager's new-found powers help him score at basketball - and with the popular girls - he has some pretty hairy decisions to make.","why":"Not scary.","genres":["Comedy","Fantasy","Romance"],"id":11824,"f":"","o":0,"x":0,"p":"/bv9rY9eoue2Hat6tcvrKVQ0ow8v.jpg","rt":92},{"t":"Explorers","y":1985,"cat":"Family spooky","rated":"PG","sc":1,"syn":"Middle schooler Ben spends his free time watching sci-fi films, playing video games and reading comic books. Surprisingly, his affinity for all things fantastical yields a real result – when he has a vivid dream about technology, his prodigy best friend Wolfgang manages to create a working spacecraft. Joined by their buddy Darren, the boys take off into outer space and encounter some very odd extraterrestrial life.","why":"Not scary.","genres":["Science Fiction","Adventure","Family"],"id":9872,"f":"","o":0,"x":0,"p":"/oFJosj5ECYjf1jkvpTEjGNzPx2x.jpg","rt":109},{"t":"12 Monkeys","y":1995,"cat":"Scary sci-fi","rated":"R","sc":5,"syn":"In the year 2035, convict James Cole reluctantly volunteers to be sent back in time to discover the origin of a deadly virus that wiped out nearly all of the earth's population and forced the survivors into underground communities. But when Cole is mistakenly sent to 1990 instead of 1996, he's arrested and locked up in a mental hospital. There he meets psychiatrist Dr. Kathryn Railly and the son of a famous virus expert who may hold the key to the Army of the 12 Monkeys; thought to be responsible for unleashing the killer disease.","why":"A bleak time-travel mystery with asylum scenes and a plague.","genres":["Science Fiction","Thriller","Mystery"],"id":63,"f":"","o":0,"x":0,"p":"/gt3iyguaCIw8DpQZI1LIN5TohM2.jpg","rt":129},{"t":"The 'Burbs","y":1989,"cat":"Horror comedy","rated":"PG","sc":2,"syn":"When secretive new neighbors move in next door, suburbanite Ray Peterson and his friends let their paranoia get the best of them as they start to suspect the newcomers of evildoings and commence an investigation. But it's hardly how Ray, who much prefers drinking beer, reading his newspaper and watching a ball game on the tube expected to spend his vacation.","why":"Suspicious neighbors, a creepy basement; mostly comedy.","genres":["Comedy","Horror","Thriller"],"id":11974,"f":"","o":0,"x":0,"p":"/jwYKzJS0C3A711hmg1G4ptI0InF.jpg","rt":102},{"t":"Children of Men","y":2006,"cat":"Scary sci-fi","rated":"R","sc":5,"syn":"In 2027, in a chaotic world in which humans can no longer procreate, a former activist agrees to help transport a miraculously pregnant woman to a sanctuary at sea, where her child's birth may help scientists save the future of humankind.","why":"Grim, violent, and very intense in the last act.","genres":["Science Fiction","Thriller","Action"],"id":9693,"f":"","o":0,"x":0,"p":"/k9IAS4TehZFcKi4HVByxZNPfqex.jpg","rt":109},{"t":"District 9","y":2009,"cat":"Scary sci-fi","rated":"R","sc":5,"syn":"Thirty years ago, aliens arrive on Earth. Not to conquer or give aid, but to find refuge from their dying planet. Separated from humans in a South African area called District 9, the aliens are managed by Multi-National United, which is unconcerned with the aliens' welfare but will do anything to master their advanced technology. When a company field agent contracts a mysterious virus that begins to alter his DNA, there is only one place he can hide: District 9.","why":"Gory body horror and violence.","genres":["Science Fiction"],"id":17654,"f":"","o":0,"x":0,"p":"/tuGlQkqLxnodDSk6mp5c2wvxUEd.jpg","rt":112},{"t":"Gravity","y":2013,"cat":"Scary sci-fi","rated":"PG-13","sc":5,"syn":"Dr Ryan Stone, an engineer on her first space mission, and Matt Kowalski, an astronaut on his final expedition, have to survive in space after they are hit by debris while spacewalking.","why":"Nonstop peril in space; a panic-attack movie, not monsters.","genres":["Science Fiction","Thriller","Drama"],"id":49047,"f":"","o":0,"x":0,"p":"/kZ2nZw8D681aphje8NJi8EfbL1U.jpg","rt":91},{"t":"Jurassic World","y":2015,"cat":"Scary sci-fi","rated":"PG-13","sc":4,"syn":"Twenty-two years after the events of Jurassic Park, Isla Nublar now features a fully functioning dinosaur theme park, Jurassic World, as originally envisioned by John Hammond.","why":"Dinosaur attacks, the Indominus hunts people.","genres":["Adventure","Science Fiction","Thriller"],"id":135397,"f":"","o":0,"x":0,"p":"/rhr4y79GpxQF9IsfJItRXVaoGs4.jpg","rt":124},{"t":"Jurassic World: Fallen Kingdom","y":2018,"cat":"Scary sci-fi","rated":"PG-13","sc":5,"syn":"Three years after Jurassic World was destroyed, Isla Nublar now sits abandoned. When the island's dormant volcano begins roaring to life, Owen and Claire mount a campaign to rescue the remaining dinosaurs from this extinction-level event.","why":"Haunted-house dinosaur in a mansion with a little girl.","genres":["Adventure","Science Fiction","Thriller"],"id":351286,"f":"","o":0,"x":0,"p":"/x2Us3jR6ToMJjbcPbLimYoxf6xr.jpg","rt":129},{"t":"Jurassic World Dominion","y":2022,"cat":"Scary sci-fi","rated":"PG-13","sc":3,"syn":"Four years after Isla Nublar was destroyed, dinosaurs now live—and hunt—alongside humans all over the world. This fragile balance will reshape the future and determine, once and for all, whether human beings are to remain the apex predators on a planet they now share with history's most fearsome creatures.","why":"Mostly action; giant locusts.","genres":["Adventure","Science Fiction","Thriller"],"id":507086,"f":"","o":0,"x":0,"p":"/jbAvCACjLf1ZG0unB2tdmx5HAf1.jpg","rt":147},{"t":"Escape From New York","y":1981,"cat":"Scary sci-fi","rated":"R","sc":4,"syn":"In a world ravaged by crime, the entire island of Manhattan has been converted into a walled prison where brutal prisoners roam free. After the US president crash-lands inside, war hero Snake Plissken has 24 hours to bring him back.","why":"Grimy, violent, gangs in the dark.","genres":["Action","Thriller","Science Fiction"],"id":1103,"f":"","o":0,"x":0,"p":"/vH9llaphjAssRGi0k7e75tD40Ce.jpg","rt":99},{"t":"The Running Man","y":1987,"cat":"Scary sci-fi","rated":"R","sc":4,"syn":"By 2017, the global economy has collapsed and U.S. society has become a totalitarian police state, censoring all cultural activity. The government pacifies the populace by broadcasting a number of game shows in which convicted criminals fight for their lives, including the gladiator-style The Running Man, hosted by the ruthless Damon Killian, where “runners” attempt to evade “stalkers” and certain death for a chance to be pardoned and set free.","why":"Violent game-show killers.","genres":["Action","Thriller","Science Fiction"],"id":865,"f":"","o":0,"x":0,"p":"/GTAUOhO4BN0peJVvxGEQydJvUO.jpg","rt":101},{"t":"Minority Report","y":2002,"cat":"Scary sci-fi","rated":"PG-13","sc":4,"syn":"John Anderton is a top 'Precrime' cop in the late-21st century, when technology can predict crimes before they're committed. But Anderton becomes the quarry when another investigator targets him for a murder charge.","why":"The eye-swap and spider-robot scenes.","genres":["Science Fiction","Action","Thriller"],"id":180,"f":"","o":0,"x":0,"p":"/qtgFcnwh9dAFLocsDk2ySDVS8UF.jpg","rt":145},{"t":"Fight Club","y":1999,"cat":"Thriller","rated":"R","sc":5,"syn":"A ticking-time-bomb insomniac and a slippery soap salesman channel primal male aggression into a shocking new form of therapy. Their concept catches on, with underground \"fight clubs\" forming in every town, until an eccentric gets in the way and ignites an out-of-control spiral toward oblivion.","why":"Brutal fights, dark themes.","genres":["Drama","Thriller"],"id":550,"f":"","o":0,"x":3,"p":"/jSziioSwPVrOy9Yow3XhWIBDjq1.jpg","rt":139},{"t":"The Day the Earth Stood Still","y":1951,"cat":"Scary sci-fi","rated":"G","sc":2,"syn":"An alien and a robot land on Earth after World War II and tell mankind to be peaceful or face destruction.","why":"Gort the robot looks menacing; gentle overall.","genres":["Science Fiction","Thriller","Drama"],"id":828,"f":"","o":0,"x":0,"p":"/eslDNzf0LF1m9GsgUXlmyfTcC6Y.jpg","rt":92},{"t":"Mystic River","y":2003,"cat":"Thriller","rated":"R","sc":5,"syn":"The lives of three men who were childhood friends are shattered when one of them suffers a family tragedy.","why":"Child abuse themes, a murdered teen.","genres":["Thriller","Drama","Mystery","Crime"],"id":322,"f":"","o":0,"x":0,"p":"/hCHVDbo6XJGj3r2i4hVjKhE0GKF.jpg","rt":138},{"t":"Chronicle","y":2012,"cat":"Scary sci-fi","rated":"PG-13","sc":4,"syn":"Three high school students make an incredible discovery, leading to their developing uncanny powers beyond their understanding. As they learn to control their abilities and use them to their advantage, their lives start to spin out of control, and their darker sides begin to take over.","why":"A teen with powers turns dark and violent.","genres":["Science Fiction","Drama","Thriller"],"id":76726,"f":"","o":0,"x":0,"p":"/kdyrdFIt29FUmLIKvedAc2j4rpo.jpg","rt":84},{"t":"The Day After Tomorrow","y":2004,"cat":"Scary sci-fi","rated":"PG-13","sc":3,"syn":"After paleoclimatologist Jack Hall is largely ignored by UN officials when presenting his environmental concerns about the beginning of a new Ice Age, his research proves true when a superstorm develops, setting off catastrophic natural disasters throughout the world. Trying to get to his son, Sam, who is trapped in New York City with his friend Laura and others, Jack and his crew must travel to get to Sam before it's too late.","why":"Disaster peril, wolves on a ship.","genres":["Science Fiction","Thriller","Adventure"],"id":435,"f":"","o":0,"x":0,"p":"/Wr4HeYQRvwVCxzOV5TmGE7UkXq.jpg","rt":124},{"t":"Terminator 3: Rise of the Machines","y":2003,"cat":"Scary sci-fi","rated":"R","sc":4,"syn":"It's been 10 years since John Connor saved Earth from Judgment Day, and he's now living under the radar, steering clear of using anything Skynet can trace. That is, until he encounters T-X, a robotic assassin ordered to finish what T-1000 started. Good thing Connor's former nemesis, the Terminator, is back to aid the now-adult Connor … just like he promised.","why":"Robot violence; nuclear ending.","genres":["Action","Thriller","Science Fiction"],"id":296,"f":"","o":0,"x":2,"p":"/vvevzdYIrk2636maNW4qeWmlPFG.jpg","rt":109},{"t":"Terminator Salvation","y":2009,"cat":"Scary sci-fi","rated":"PG-13","sc":4,"syn":"All grown up in post-apocalyptic 2018, John Connor must lead the resistance of humans against the increasingly dominating militaristic robots. But when Marcus Wright appears, his existence confuses the mission as Connor tries to determine whether Wright has come from the future or the past -- and whether he's friend or foe.","why":"Robot attacks in a ruined world.","genres":["Action","Science Fiction","Thriller"],"id":534,"f":"","o":0,"x":0,"p":"/gw6JhlekZgtKUFlDTezq3j5JEPK.jpg","rt":115},{"t":"Terminator Genisys","y":2015,"cat":"Scary sci-fi","rated":"PG-13","sc":3,"syn":"The year is 2029. John Connor, leader of the resistance continues the war against the machines. At the Los Angeles offensive, John's fears of the unknown future begin to emerge when TECOM spies reveal a new plot by SkyNet that will attack him from both fronts; past and future, and will ultimately change warfare forever.","why":"Mostly action.","genres":["Science Fiction","Action","Thriller"],"id":87101,"f":"","o":0,"x":0,"p":"/oZRVDpNtmHk8M1VYy1aeOWUXgbC.jpg","rt":126},{"t":"Terminator: Dark Fate","y":2019,"cat":"Scary sci-fi","rated":"R","sc":4,"syn":"Decades after Sarah Connor prevented Judgment Day, a lethal new Terminator is sent to eliminate the future leader of the resistance. In a fight to save mankind, battle-hardened Sarah Connor teams up with an unexpected ally and an enhanced super soldier to stop the deadliest Terminator yet.","why":"Relentless killer robot, violence.","genres":["Science Fiction","Action","Adventure","Thriller"],"id":290859,"f":"","o":0,"x":0,"p":"/vqzNJRH4YyquRiWxCCOH0aXggHI.jpg","rt":128},{"t":"WarGames","y":1983,"cat":"Thriller","rated":"PG","sc":2,"syn":"High school student David Lightman has a talent for hacking. But while trying to hack into a computer system to play unreleased video games, he unwittingly taps into the Department of Defense's war computer and initiates a confrontation of global proportions. Together with his friend and a wizardly computer genius, David must race against time to outwit his opponent and prevent a nuclear Armageddon.","why":"Nuclear-war tension, ar, prison camp.","genres":["Drama","Science Fiction","War"],"id":281338,"f":"","o":0,"x":0,"p":"/3vYhLLxrTtZLysXtIWktmd57Snv.jpg","rt":140},{"t":"The Matrix","y":1999,"cat":"Scary sci-fi","rated":"R","sc":4,"syn":"Set in the 22nd century, The Matrix tells the story of a computer hacker who joins a group of underground insurgents fighting the vast and powerful computers who now rule the earth.","why":"The bug in the stomach, the pod-waking scene.","genres":["Action","Science Fiction"],"id":603,"f":"","o":0,"x":0,"p":"/dXNAPwY7VrqMAo51EKhhCJfaGb5.jpg","rt":136},{"t":"Total Recall","y":1990,"cat":"Scary sci-fi","rated":"R","sc":5,"syn":"Construction worker Douglas Quaid's obsession with the planet Mars leads him to visit Rekall, a virtual vacation company that manufactures memories. When something goes wrong during Quaid's memory implant procedure, his life turns upside down, leading him to question what is reality and what isn't.","why":"Gory, bulging eyes in Mars air.","genres":["Action","Adventure","Science Fiction"],"id":861,"f":"","o":0,"x":3,"p":"/wVbeL6fkbTKSmNfalj4VoAUUqJv.jpg","rt":113},{"t":"2001: A Space Odyssey","y":1968,"cat":"Scary sci-fi","rated":"G","sc":3,"syn":"Humanity finds a mysterious object buried beneath the lunar surface and sets off to find its origins with the help of HAL 9000, the world's most advanced super computer.","why":"HAL's calm menace; slow and eerie.","genres":["Science Fiction","Mystery","Adventure"],"id":62,"f":"","o":0,"x":0,"p":"/ve72VxNqjGM69Uky4WTo2bK6rfq.jpg","rt":149},{"t":"Arrival","y":2016,"cat":"Scary sci-fi","rated":"PG-13","sc":2,"syn":"Taking place after alien crafts land around the world, an expert linguist is recruited by the military to determine whether they come in peace or are a threat.","why":"Eerie aliens, more awe than fear.","genres":["Drama","Science Fiction","Mystery"],"id":329865,"f":"","o":0,"x":0,"p":"/pEzNVQfdzYDzVK0XqxERIw2x2se.jpg","rt":116},{"t":"A.I. Artificial Intelligence","y":2001,"cat":"Scary sci-fi","rated":"PG-13","sc":4,"syn":"David, a robotic boy—the first of his kind programmed to love—is adopted as a test case by a Cybertronics employee and his wife. Though he gradually becomes their child, a series of unexpected circumstances make this life impossible for David.","why":"The Flesh Fair destroying robots upsets kids.","genres":["Drama","Science Fiction","Adventure"],"id":644,"f":"","o":0,"x":0,"p":"/wnUAcUrMRGPPZUDroLeZhSjLkuu.jpg","rt":146},{"t":"Venom","y":2018,"cat":"Scary sci-fi","rated":"PG-13","sc":3,"syn":"Investigative journalist Eddie Brock attempts a comeback following a scandal, but accidentally becomes the host of Venom, a violent, super powerful alien symbiote. Soon, he must rely on his newfound powers to protect the world from a shadowy organization looking for a symbiote of their own.","why":"Creature head-biting, mostly action.","genres":["Science Fiction","Action"],"id":335983,"f":"","o":0,"x":0,"p":"/2uNW4WbgBXL25BAbXGLnLqX71Sw.jpg","rt":112},{"t":"The Hunger Games","y":2012,"cat":"Thriller","rated":"PG-13","sc":4,"syn":"In a dystopian society where the Capitol forces each district to send two young tributes to fight to the death in a televised spectacle, a girl volunteers to take her sister’s place, setting the stage for a struggle of survival and defiance.","why":"Kids killing kids, tracker-jacker hallucinations.","genres":["Science Fiction","Adventure","Action","Thriller"],"id":70160,"f":"","o":0,"x":0,"p":"/apa5G43Hha7kH7wJG0gkkHT7FA9.jpg","rt":142},{"t":"Blade Runner","y":1982,"cat":"Scary sci-fi","rated":"R","sc":3,"syn":"In the smog-choked dystopian Los Angeles of 2019, blade runner Rick Deckard is called out of retirement to terminate a quartet of replicants who have escaped to Earth seeking their creator for a way to extend their short life spans.","why":"Moody, a few violent scenes.","genres":["Science Fiction","Drama","Thriller"],"id":78,"f":"","o":0,"x":0,"p":"/63N9uy8nd9j7Eog2axPQ8lbr3Wj.jpg","rt":118},{"t":"Escape from L.A.","y":1996,"cat":"Scary sci-fi","rated":"R","sc":3,"syn":"Into the 9.6-quaked Los Angeles of 2013 comes Snake Plissken. His job: wade through L.A.'s ruined landmarks to retrieve a doomsday device.","why":"Campy violence.","genres":["Action","Thriller","Science Fiction"],"id":10061,"f":"","o":0,"x":0,"p":"/3L9lL2eUsmLNNfENPwNOc82Hzpw.jpg","rt":101},{"t":"Cloak & Dagger","y":1984,"cat":"Thriller","rated":"PG","sc":3,"syn":"Davey Osborne is an average 11-year-old boy with an overactive imagination. He spends his days playing video games and pretending to be a spy with his imaginary father-figure, Jack Flack - a substitute for his real father, who is struggling with the recent death of Davey's mother. However, fantasy becomes reality for Davey after he witnesses the murder of an FBI agent, who in his dying breath, gives Davey a mysterious video game cartridge called Cloak & Dagger, which in actuality contains top-secret government information. With the help of his younger friend Kim, the tech savvy Morris, and even a little help from his fictional secret agent mentor, Davey must stay one step ahead of pursuers as he tries to survive a real-life game of espionage in the streets of San Antonio, Texas.","why":"A boy chased by real killers; one shooting.","genres":["Adventure","Action","Family"],"id":48677,"f":"","o":0,"x":0,"p":"/v42bfxsJwujF8L892RXXqiYslZ1.jpg","rt":101},{"t":"E.T. The Extra-Terrestrial","y":1982,"cat":"Scary sci-fi","rated":"PG","sc":2,"syn":"An alien is left behind on Earth and saved by the 10-year-old Elliott who decides to keep him hidden in his home. While a task force hunts for the extra-terrestrial, Elliott, his brother, and his little sister Gertie form an emotional bond with their new friend, and try to help him find his way home.","why":"The men in hazmat suits, a dying E.T. Scares some little kids.","genres":["Adventure","Science Fiction","Family"],"id":601,"f":"","o":0,"x":0,"p":"/an0nD6uq6byfxXCfk6lQBzdL2J1.jpg","rt":115},{"t":"Innerspace","y":1987,"cat":"Scary sci-fi","rated":"PG","sc":1,"syn":"Test pilot Tuck Pendleton volunteers to test a special vessel for a miniaturization experiment. Accidentally injected into a neurotic hypochondriac, Jack Putter, Tuck must convince Jack to find his ex-girlfriend, Lydia Maxwell, to help him extract Tuck and his ship and re-enlarge them before his oxygen runs out.","why":"Comedy; mild peril.","genres":["Action","Comedy","Science Fiction"],"id":2614,"f":"","o":0,"x":0,"p":"/nuK4HEeIByWg1BSJrXAAQ4pIAJW.jpg","rt":120}];
const IMG = "https://image.tmdb.org/t/p/";
const OCC = ["None", "Spooky: ghosts, vampires, classic monsters", "Cartoon occult, like Ghostbusters", "Serious: hauntings, curses, witchcraft", "Demonic threat", "Full demonic, like The Conjuring"];
const SEX = ["None", "Innuendo, nothing shown", "Brief non-sexual nudity", "A sex scene or clear nudity", "Graphic, or sexual assault shown", "Explicit or brutal"];
const PRESETS = [
  { id: "little", name: "Little kids", sub: "Scare 1–3", s: { min: 1, max: 3, oc: 1, sx: 0, cult: true } },
  { id: "family", name: "Family night", sub: "Scare 1–5", s: { min: 1, max: 5, oc: 2, sx: 1, cult: true } },
  { id: "teens", name: "Teens", sub: "Scare 1–7", s: { min: 1, max: 7, oc: 3, sx: 2, cult: false } },
  { id: "adults", name: "Grown-ups", sub: "Everything", s: { min: 1, max: 10, oc: 5, sx: 5, cult: false } },
];
const DEFAULT = { min: 1, max: 10, oc: 5, sx: 5, cult: false, cats: [], sort: "scare", q: "" };
let S = { ...DEFAULT };
try { const saved = JSON.parse(localStorage.getItem("scare-night") || "null"); if (saved) S = { ...DEFAULT, ...saved, q: "" }; } catch {}
const save = () => { try { localStorage.setItem("scare-night", JSON.stringify({ ...S, q: "" })); } catch {} };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lv = (sc) => (sc <= 3 ? "low" : sc <= 6 ? "mid" : "high");

const presetsEl = $("#presets");
presetsEl.innerHTML = PRESETS.map((p) => `<button class="pill" type="button" data-p="${p.id}">${p.name}<small>${p.sub}</small></button>`).join("");
presetsEl.addEventListener("click", (e) => {
  const b = e.target.closest(".pill"); if (!b) return;
  const p = PRESETS.find((x) => x.id === b.dataset.p); S = { ...S, ...p.s }; sync(); render();
});
const cats = [...new Set(MOVIES.map((m) => m.cat))].sort();
$("#cats").innerHTML = cats.map((c) => `<button class="chip" type="button" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$("#cats").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  const c = b.dataset.c; S.cats = S.cats.includes(c) ? S.cats.filter((x) => x !== c) : [...S.cats, c]; sync(); render();
});

function sync() {
  $("#scMin").value = S.min; $("#scMax").value = S.max; $("#oc").value = S.oc; $("#sx").value = S.sx;
  $("#cult").checked = S.cult; $("#sort").value = S.sort;
  $("#scV").textContent = S.min === S.max ? S.min : `${S.min}–${S.max}`;
  $("#ocV").textContent = S.oc; $("#ocH").textContent = OCC[S.oc];
  $("#sxV").textContent = S.sx; $("#sxH").textContent = SEX[S.sx];
  document.querySelectorAll("#cats .chip").forEach((b) => b.setAttribute("aria-pressed", S.cats.includes(b.dataset.c)));
  document.querySelectorAll(".pill").forEach((b) => {
    const p = PRESETS.find((x) => x.id === b.dataset.p).s;
    b.setAttribute("aria-pressed", Object.keys(p).every((k) => S[k] === p[k]));
  });
  const n = (S.min > 1 || S.max < 10) + (S.oc < 5) + (S.sx < 5) + S.cult + (S.cats.length > 0);
  $("#fcount").hidden = !n; $("#fcount").textContent = n;
}
function filtered() {
  const q = S.q.trim().toLowerCase();
  const rows = MOVIES.filter((m) => m.sc >= S.min && m.sc <= S.max && m.o <= S.oc && m.x <= S.sx &&
    !(S.cult && m.f.includes("c")) && (!S.cats.length || S.cats.includes(m.cat)) &&
    (!q || `${m.t} ${m.syn} ${m.why} ${m.genres.join(" ")}`.toLowerCase().includes(q)));
  const by = { title: (a, b) => a.t.localeCompare(b.t), year: (a, b) => b.y - a.y, old: (a, b) => a.y - b.y,
    "scare-desc": (a, b) => b.sc - a.sc || a.t.localeCompare(b.t), scare: (a, b) => a.sc - b.sc || a.t.localeCompare(b.t) };
  return rows.sort(by[S.sort] || by.scare);
}
function render() {
  save();
  const rows = filtered();
  const parts = [`Scare ${S.min === S.max ? S.min : S.min + "–" + S.max}`];
  if (S.oc < 5) parts.push(`supernatural ≤${S.oc}`);
  if (S.sx < 5) parts.push(`sex ≤${S.sx}`);
  if (S.cult) parts.push("no cults");
  $("#summary").innerHTML = `<b>${rows.length}</b> movies · ${esc(parts.join(" · "))}`;
  $("#grid").innerHTML = rows.length ? rows.map((m) => `
    <button class="card" type="button" data-i="${MOVIES.indexOf(m)}">
      <div class="poster">${m.p ? `<img loading="lazy" src="${IMG}w342${m.p}" alt="">` : ""}<span class="badge lv-${lv(m.sc)}" aria-label="Scare ${m.sc} of 10">${m.sc}</span></div>
      <div class="ct">${esc(m.t)}</div>
      <div class="cm">${m.y} · ${esc(m.rated || "NR")}</div>
    </button>`).join("")
    : `<div class="empty"><b>Nothing fits those filters</b>Try a wider scare range or tap Reset.</div>`;
}
$("#grid").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openDetail(MOVIES[+c.dataset.i]); });

const meter = (label, v, max, color, note) => `
  <div class="meter-row"><span class="lbl">${label}</span>
    <span class="track" style="--c:${color}">${Array.from({ length: max }, (_, i) => `<i class="${i < v ? "on" : ""}"></i>`).join("")}</span>
    <span class="val">${v}/${max}</span>${note ? `<span class="meter-note">${esc(note)}</span>` : ""}</div>`;
function openDetail(m) {
  const mn = `/movies.html?movie=${encodeURIComponent(m.t)}`;
  const tm = `https://www.themoviedb.org/${m.tv ? "tv" : "movie"}/${m.id}`;
  const scC = `var(--s-${lv(m.sc)})`;
  $("#dBody").innerHTML = `
    <div class="d-top">${m.p ? `<img src="${IMG}w342${m.p}" alt="">` : "<span></span>"}
      <div><div class="d-title" id="dTitle">${esc(m.t)}</div>
        <div class="d-meta"><span>${m.y}</span><span class="r">${esc(m.rated || "NR")}</span>${m.rt ? `<span>${Math.floor(m.rt / 60)}h ${m.rt % 60}m</span>` : ""}</div>
        <div class="tags">${m.genres.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}${m.f.includes("c") ? '<span class="tag warn">Cult</span>' : ""}</div>
      </div></div>
    <div class="meters">
      ${meter("Scare", m.sc, 10, scC)}
      ${meter("Supernatural", m.o, 5, "var(--gold)", m.o ? OCC[m.o] : "")}
      ${meter("Sex & nudity", m.x, 5, "var(--gold)", m.x ? SEX[m.x] : "")}
    </div>
    <p class="d-why"><b>Why it scares:</b> ${esc(m.why)}</p>
    <p class="d-syn">${esc(m.syn)}</p>
    ${m.uns ? '<p class="guess">Newer film. These scores are a best guess.</p>' : ""}
    <div class="sheet-actions">
      <a class="btn primary" href="${mn}">Open in Movie Night</a>
      <a class="btn ghost" href="${tm}" target="_blank" rel="noopener">TMDB</a>
    </div>`;
  openSheet($("#detail"));
}

let openEl = null, lastFocus = null;
function openSheet(el) {
  if (openEl) closeSheet(true);
  lastFocus = document.activeElement; openEl = el; el.hidden = false; el.scrollTop = 0;
  requestAnimationFrame(() => { el.classList.add("open"); $("#scrim").classList.add("open"); });
  document.body.style.overflow = "hidden";
  setTimeout(() => el.querySelector("button, a")?.focus({ preventScroll: true }), 50);
}
function closeSheet(instant) {
  if (!openEl) return; const el = openEl; openEl = null;
  el.classList.remove("open"); $("#scrim").classList.remove("open"); document.body.style.overflow = "";
  setTimeout(() => { if (!el.classList.contains("open")) el.hidden = true; }, instant ? 0 : 300);
  lastFocus?.focus?.({ preventScroll: true });
}
$("#scrim").onclick = () => closeSheet();
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
// swipe down to close
document.querySelectorAll(".sheet").forEach((el) => {
  let y0 = null;
  el.addEventListener("touchstart", (e) => { y0 = el.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  el.addEventListener("touchmove", (e) => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) el.style.transform = `translateY(${dy}px)`; }, { passive: true });
  el.addEventListener("touchend", (e) => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; el.style.transform = ""; y0 = null; if (dy > 90) closeSheet(); });
});

const openFilters = () => openSheet($("#filters"));
$("#openFilters").onclick = openFilters; $("#openFilters2").onclick = openFilters;
$("#fDone").onclick = () => { closeSheet(); window.scrollTo({ top: 0, behavior: "smooth" }); };
const reset = () => { S = { ...DEFAULT, q: S.q }; sync(); render(); };
$("#fReset").onclick = reset; $("#reset").onclick = reset;
$("#tabBrowse").onclick = () => { closeSheet(); window.scrollTo({ top: 0, behavior: "smooth" }); };
$("#surprise").onclick = () => { const r = filtered(); if (r.length) openDetail(r[Math.floor(Math.random() * r.length)]); };
$("#q").addEventListener("input", (e) => { S.q = e.target.value; render(); });
$("#scMin").addEventListener("input", (e) => { S.min = +e.target.value; if (S.min > S.max) S.max = S.min; sync(); render(); });
$("#scMax").addEventListener("input", (e) => { S.max = +e.target.value; if (S.max < S.min) S.min = S.max; sync(); render(); });
$("#oc").addEventListener("input", (e) => { S.oc = +e.target.value; sync(); render(); });
$("#sx").addEventListener("input", (e) => { S.sx = +e.target.value; sync(); render(); });
$("#cult").addEventListener("change", (e) => { S.cult = e.target.checked; sync(); render(); });
$("#sort").addEventListener("change", (e) => { S.sort = e.target.value; sync(); render(); });
sync(); render();
</script>
</body>
</html>
